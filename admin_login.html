<!doctype html>
<html>
  <head>
    <title>Admin Login</title>
    <style>
      body {
        font-family: Arial;
        background-color: #f2f2f2;
        text-align: center;
        margin-top: 100px;
      }

      .login-box {
        background: white;
        padding: 30px;
        width: 320px;
        margin: auto;
        border-radius: 10px;
        box-shadow: 0px 0px 10px gray;
      }

      input {
        width: 90%;
        padding: 8px;
        margin: 10px 0;
      }

      button {
        padding: 8px 15px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .back-btn {
        background-color: #4caf50;
        margin-top: 10px;
      }

      .error {
        background-color: #ffdddd;
        color: #a94442;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 5px;
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <h2>Admin Login</h2>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post">
        <input name="email" placeholder="Admin Email" required /><br />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        /><br />
        <button type="submit">Login</button>
      </form>

      <hr />

      <a href="/login">
        <button class="back-btn">Back to Student Login</button>
      </a>
    </div>
  </body>
</html>
